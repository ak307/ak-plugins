<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion kit — changing screen</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
  header { position: sticky; top: 0; padding: 12px 20px; color: #fff; background: #14202e; }
  .band { padding: 40px 20px; color: #fff; background: #1d3350; }
  .rows p, .skeleton { margin: 12px 20px; padding: 14px; border-radius: 10px; background: #eef1f5; }
  .skeleton { height: 22px; }
  .tall { height: 1600px; }
</style>
</head>
<body>
<header id="bar">Work orders <button id="open" type="button">Open the form</button> <button id="back" type="button">Back to the list</button></header>
<main id="main"></main>

</body>
