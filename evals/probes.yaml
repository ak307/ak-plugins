        version = "0.1.0"
        dependencies = []
      app/__init__.py: ""
      app/services/__init__.py: ""
      app/services/overtime.py: |
        from datetime import datetime

        NORMAL_HOURS_PER_DAY = 8


        def overtime_pay(clock_in: datetime, clock_out: datetime, hourly_rate: float, is_public_holiday: bool = False) -> float:
            hours = (clock_out - clock_in).total_seconds() / 3600
            if hours > 6:
                hours = hours - 1
            if is_public_holiday:
                return round(hours * hourly_rate * 2, 2)
            extra = hours - NORMAL_HOURS_PER_DAY
            if extra <= 0:
                return 0.0
            if clock_in.weekday() >= 5:
                return round(hours * hourly_rate * 1.5, 2)
            return round(extra * hourly_rate * 1.5, 2)
    prompt: 'add a night-shift allowance to the overtime calculation: hours worked between 22:00 and 06:00 earn an extra 20% of the hourly rate.'
