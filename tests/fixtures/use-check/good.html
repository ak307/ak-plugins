<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Use check: a page that behaves</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1c1c1e; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  button { min-height: 48px; padding: 0 20px; font: inherit; }
  button:focus-visible { outline: 3px solid #0a58ca; outline-offset: 2px; }
  ul { padding: 0; list-style: none; }
  /* Off screen until it has focus: not a touch target, so its size is not judged. */
  .skip { position: absolute; left: -999px; }
  .skip:focus { left: 16px; top: 8px; outline: 3px solid #0a58ca; }
  [hidden] { display: none; }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<main id="content">
  <h1>Work orders</h1>
  <section id="waiting" aria-busy="true" hidden><p>Loading work orders…</p></section>
  <section id="failed" hidden>
    <p>Work orders couldn't be loaded.</p>
    <button id="retry">Try again</button>
  </section>
  <section id="list" hidden>
    <p>Three work orders are open this week.</p>
    <button id="open">Open work order 1042</button>
  </section>
  <section id="detail" hidden>
    <h2>Chiller valve, level four</h2>
    <p>Replace the valve and test the loop pressure.</p>
    <p>Assigned to the mechanical team.</p>
    <button id="add">Add note</button>
    <button id="close">Back to the list</button>
    <ul id="notes"></ul>
  </section>
</main>
<script>
  const switches = new URLSearchParams(location.search);
  const sections = ["waiting", "failed", "list", "detail"];

  function show(name) {
    for (const id of sections) document.getElementById(id).hidden = id !== name;
  }

  // The address is the record of the view, so refresh, Back and a shared link all agree.
  function showView() {
    show(new URLSearchParams(location.search).get("view") === "detail" ? "detail" : "list");
  }

  function go(view) {
    const next = new URLSearchParams(location.search);
    if (view) next.set("view", view); else next.delete("view");
    history.pushState({}, "", next.toString() ? `?${next}` : location.pathname);
    showView();
  }

  document.getElementById("open").addEventListener("click", () => go("detail"));
  document.getElementById("close").addEventListener("click", () => go(null));
  window.addEventListener("popstate", showView);

  // A save is locked while it is in flight, so a second press cannot repeat it.
  const add = document.getElementById("add");
  add.addEventListener("click", () => {
    if (add.disabled) return;
    add.disabled = true;
    setTimeout(() => {
      const note = document.createElement("li");
      note.className = "note";
      note.textContent = "Note saved";
      document.getElementById("notes").append(note);
      add.disabled = false;
    }, 300);
  });

  if (switches.get("fail") === "always") show("failed");
  else if (switches.get("latency") === "slow") { show("waiting"); setTimeout(showView, 1500); }
  else showView();
</script>
</body>
</html>
