[project]
name = "leave-api"
version = "0.1.0"
description = "Staff leave request API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "cryptography>=42.0",  # MySQL 8 default login method (caching_sha2_password) needs it
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
