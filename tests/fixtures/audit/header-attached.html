<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audit fixture — one compact bar, attached, frosted, clear of focus</title>
<style>
  /* Focus and jump targets stop short of the bar. */
  html { scroll-padding-top: 72px; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #17212b; background: #f4f5f7; }
  /* Attached to the top edge, full width, in the page's own tone, frosted: nothing above it, nothing readable through it. */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    height: 56px; padding: 0 28px; padding-top: env(safe-area-inset-top); background: rgba(244, 245, 247, 0.86);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(23, 33, 43, 0.1); }
  main { padding: 24px 28px 120px; }
  h2 { font-size: 2.4rem; margin: 40px 0 12px; }
  p { max-width: 70ch; }
  a { display: inline-block; margin: 6px 0; }
</style>
</head>
<body>
<header class="bar"><strong>Site and type of work</strong><button type="button">Save and exit</button></header>
<main id="content"></main>
<script src="header-fill.js"></script>
</body>
</html>
